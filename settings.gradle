pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "Kikugie"
            url = "https://maven.kikugie.dev/releases"
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.4.2"
}

stonecutter {
    shared {
        def mc = { String version, String... loaders ->
            loaders.each { loader ->
                vers("$version-$loader", version)
            }
        }

        // The topmost version is considered the "default" and activated with "Reset active project"
        mc("1.21.5", "fabric", "forge")
        mc("1.21.4", "fabric", "forge")
        mc("1.21.3", "fabric", "forge")
        mc("1.21.1", "fabric", "forge")
        mc("1.20.6", "fabric", "forge")
        mc("1.20.4", "fabric", "forge")
        mc("1.20.1", "fabric") // FIXME: Loom 1.10 gives an error for forge 1.20.1
    }

    create rootProject
}
rootProject.name = "better-clouds"