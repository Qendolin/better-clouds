# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ pull_request, push ]

jobs:
  build:
    name: build_${{ matrix.loader }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: list gradle projects
        run: ./gradlew -q projects
      - name: build project
        run: ./gradlew :${{ matrix.loader }}:build
      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}-artifacts
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  client-world-load:
    name: gametest_${{ matrix.loader }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
        game_version: [ 26.1 ]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.loader }}-artifacts
          path: run/mods

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Ferium
        run: |
          curl -L https://github.com/gorilla-devs/ferium/releases/download/v4.7.1/ferium-linux-nogui.zip -o ferium.zip
          unzip ferium.zip -d ferium-bin
          chmod +x ferium-bin/ferium
          sudo mv ferium-bin/ferium /usr/local/bin/ferium

      - name: Download runtime mods
        run: |
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            ferium add fabric-api
          fi
          ferium add distanthorizons
          ferium add yacl
          ferium profile configure \
            --game-version ${{ matrix.game_version }} \
            --mod-loader ${{ matrix.loader }} \
            --output-dir run/mods
          ferium upgrade

      - name: Load client world
        timeout-minutes: 2
        uses: headlesshq/mc-runtime-test@4.4.0
        with:
          mc: 26.1.2
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          xvfb: true
          java: 25
          mc-runtime-test: ${{ matrix.loader }}
          headlessmc-command: --jvm "-Djava.awt.headless=true"
