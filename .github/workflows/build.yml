# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ pull_request, push ]

jobs:
  build:
    name: build_${{ matrix.mc-version }}-${{ matrix.loader }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, forge ]
        mc-version: [1.20.6, 1.21.1, 1.21.11]
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
      BUILD_TARGET: ${{ matrix.mc-version }}-${{ matrix.loader }}
      ORG_GRADLE_PROJECT_modTarget: ${{ matrix.mc-version }}-${{ matrix.loader }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: switch stonecutter version
        run: ./gradlew stonecutterSwitchTo${{ env.BUILD_TARGET }}
      - name: list gradle projects
        run: ./gradlew -q projects
      - name: build project
        run: ./gradlew :${{ env.BUILD_TARGET }}:build
      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TARGET }}-artifacts
          path: |
            versions/${{ env.BUILD_TARGET }}/build/libs/*.jar
          if-no-files-found: error

  client-world-load:
    name: gametest_${{ matrix.mc-version }}-${{ matrix.loader }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, forge ]
        mc-version: [1.20.6, 1.21.1, 1.21.11]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_TARGET }}-artifacts
          path: run/mods

      - name: Remove sources jar
        run: find run/mods -type f -name '*sources*.jar' -delete

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Ferium
        run: |
          curl -L https://github.com/gorilla-devs/ferium/releases/download/v4.7.1/ferium-linux-nogui.zip -o ferium.zip
          unzip ferium.zip -d ferium-bin
          chmod +x ferium-bin/ferium
          sudo mv ferium-bin/ferium /usr/local/bin/ferium

      - name: Download runtime mods
        run: |
          ferium_mod_loader="${{ matrix.loader }}"
          if [ "$ferium_mod_loader" = "forge" ]; then
            ferium_mod_loader="neo-forge"
          fi

          sudo ferium profile create \
            --name "Actions runtime for ${{ matrix.loader }} ${{ matrix.mc-version }}" \
            --game-version "${{ matrix.mc-version }}" \
            --mod-loader "$ferium_mod_loader" \
            --output-dir "$PWD/run/mods"
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            sudo ferium add fabric-api
          fi
          sudo ferium add distanthorizons yacl
          sudo ferium upgrade

      - name: Load client world
        timeout-minutes: 2
        uses: headlesshq/mc-runtime-test@4.4.0
        with:
          mc: ${{ matrix.mc-version }}
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          xvfb: true
          java: 25
          mc-runtime-test: ${{ matrix.loader }}
          dummy-assets: true
          download-hmc: true
          headlessmc-command: --jvm "-Djava.awt.headless=true"
