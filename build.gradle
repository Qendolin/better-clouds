import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
	id "dev.architectury.loom" version "1.13-SNAPSHOT"
	id "architectury-plugin" version "3.4-SNAPSHOT"
	id "me.modmuss50.mod-publish-plugin"
}

apply from: rootProject.file('common.gradle').path

base {
	archivesName = project.archives_base_name
}

var loader = loom.platform.get().displayName.toLowerCase()
var mcVersion = stonecutter.current.version

var isFabric = loader == "fabric"
var isNeoForge = loader == "neoforge"

stonecutter {
	dependencies {
		put("yacl", property('deps.yacl'))
	}
	constants {
		put("fabric", isFabric)
		put("neoforge", isNeoForge)
	}
}

stonecutter.filters.include("**/*.vsh")
stonecutter.filters.include("**/*.fsh")

def publishTargetDefinitions = [
		fabric   : [
				loader    : "fabric",
				loaderName: "Fabric",
				modrinth  : [
						requires    : ["yacl", "fabric-api"],
						optional    : ["modmenu", "sodium", "iris"],
						incompatible: ["vulkanmod", "immersiveportals"],
				],
				curseforge: [
						requires    : ["yacl", "fabric-api"],
						optional    : ["modmenu", "sodium", "irisshaders"],
						incompatible: ["vulkanmod", "immersive-portals-mod"],
				],
		],
		neoforge : [
				loader    : "neoforge",
				loaderName: "NeoForge",
				modrinth  : [
						requires    : ["yacl"],
						optional    : ["sodium", "iris"],
						incompatible: [],
				],
				curseforge: [
						requires    : ["yacl"],
						optional    : ["sodium", "irisshaders"],
						incompatible: [],
				],
		],
]

def publishTargetConfig = publishTargetDefinitions[loader]

def parseBooleanGradleProperty = { String name, boolean defaultValue ->
	providers.gradleProperty(name).map { value ->
		def normalized = value.trim().toLowerCase(Locale.ROOT)
		if (!(normalized in ["true", "false"])) {
			throw new GradleException("Property ${name} must be either true or false, got '${value}'.")
		}
		normalized == "true"
	}.orElse(defaultValue)
}

def isPublishTargetEnabled = { String target ->
	parseBooleanGradleProperty("publish.${target}", true).get()
}

def isPublishConfirmationSkipped = {
	parseBooleanGradleProperty("publish.skipConfirmation", false).get()
}

def requirePublishConfirmation = { List<String> warningLines ->
	warningLines.each { warningLine -> println warningLine }
	println "Press Enter to continue, or Ctrl+C to cancel."

	def console = System.console()
	if (console != null) {
		console.readLine()
		return
	}

	def line = new BufferedReader(new InputStreamReader(System.in)).readLine()
	if (line == null) {
		throw new GradleException("Interactive confirmation required. Re-run this publish command in a console and press Enter to continue.")
	}
}

def changelogFile = rootProject.layout.projectDirectory.file("changelog.md").asFile
def maxChangelogAgeMs = 60L * 60L * 1000L

def validatePublishChangelog = {
	if (!changelogFile.exists()) {
		throw new GradleException("Missing changelog.md. Update it within the last hour before publishing.")
	}

	def changelog = changelogFile.getText("UTF-8")
	if (changelog.isBlank()) {
		throw new GradleException("changelog.md was blank")
	}

	def changelogAgeMs = System.currentTimeMillis() - changelogFile.lastModified()
	if (changelogAgeMs > maxChangelogAgeMs) {
		def modifiedAt = new Date(changelogFile.lastModified())
		throw new GradleException("changelog.md must be updated within the last hour before publishing. Last modified: ${modifiedAt}.")
	}
}

def loadPublishSecrets = {
	def secrets = new Properties()
	def secretsFile = rootProject.file("secrets.properties")
	if (!secretsFile.exists()) {
		throw new GradleException("Missing secrets.properties for publishing")
	}

	secretsFile.withInputStream { secrets.load(it) }
	return secrets
}

def releaseTypeEnum = {
	def releaseType = property("mod.release").toString()
	def normalizedReleaseType = releaseType.toLowerCase(Locale.ROOT)
	def releaseTypeEnum = [
			"release": "STABLE",
			"stable" : "STABLE",
			"beta"   : "BETA",
			"alpha"  : "ALPHA"
	][normalizedReleaseType]
	if (!releaseTypeEnum) {
		throw new GradleException("Unknown release type: ${releaseType}")
	}
	return releaseTypeEnum
}

static def buildVersionString(String modVersion, String releaseType, String mcVersion, String loader) {
	var semver = modVersion
	var isPrerelease = releaseType != "release"
	if (isPrerelease) semver += "-" + releaseType
	semver += "+" + mcVersion + "-" + loader
	if (isPrerelease) semver += ".rev." + 'git rev-parse --short HEAD'.execute().text.trim()
	return semver
}

static def trimSuffix(String original, String suffix) {
	if (original.endsWith(suffix)) {
		return original.substring(0, original.length() - suffix.length())
	}
	return original
}

version = buildVersionString(property('mod.version').toString(), property('mod.release').toString().toLowerCase(), mcVersion, loader)
group = project.maven_group

architectury {
	// arch runtime, enables hot reloading
	compileOnly()
	minecraft = mcVersion

	platformSetupLoomIde()
	if (isFabric)
		fabric()
	if (isNeoForge)
		neoForge()
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Xander"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven { url = "https://maven.quiltmc.org/repository/release" }
	maven { url = "https://maven.bawnorton.com/releases" }
}

loom {
	accessWidenerPath.set(project.rootProject.file("src/main/resources/betterclouds.accesswidener"))

	runs {
		configureEach {
			// Uncomment if needed, but can often lead to issues in my experience
			// vmArg "-XX:+AllowEnhancedClassRedefinition"
		}

		client {
			ideConfigGenerated true
			runDir "../../run"
		}

		server {
			ideConfigGenerated false
			runDir "../../run"
		}
	}
}

afterEvaluate {
	if (isFabric) {
		loom.runs.configureEach {
			vmArg "-javaagent:${configurations.compileClasspath.find { it.name.contains("sponge-mixin") }}"
			// Only for JetBrains Runtime
			// vmArg "-XX:+AllowEnhancedClassRedefinition"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:$mcVersion"
	mappings loom.layered {
		it.mappings("net.fabricmc:yarn:${property('loom.yarn')}:v2")
		if (property('loom.yarn_patch_neoforge') != "") {
			it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${property('loom.yarn_patch_neoforge')}")
		}
		def override = project.file("override.tiny")
		if (override.exists()) {
			println("Using mapping overrides: ${override}")
			it.mappings(override)
		}
	}

	if (isFabric) {
		modImplementation "net.fabricmc:fabric-loader:${property('loader.fabric')}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${property("deps.fabric_api")}"

		modImplementation "com.terraformersmc:modmenu:${property('deps.modmenu')}"
		modImplementation "dev.isxander:yet-another-config-lib:${property('deps.yacl')}-fabric"

		modCompileOnly "maven.modrinth:sodium-extra:${property('deps.sodium_extra')}"
		modCompileOnly "maven.modrinth:iris:${property('deps.iris')}"
		if (stonecutter.eval(mcVersion, "=1.20.1")) // coderbot package
			modCompileOnly project.rootProject.files("vendor/iris-mc1.20.1-1.6.17-ripped.jar")
		modCompileOnly "maven.modrinth:fabric-seasons:${property('deps.fabric_seasons')}"
		if (stonecutter.eval(mcVersion, ">=1.21")) {
			modCompileOnly "maven.modrinth:sodium-options-api:fabric-1.21.1-1.0.10"
		}

		include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0")))

		// for the prodClient task
		productionRuntimeMods "dev.isxander:yet-another-config-lib:${property('deps.yacl')}-fabric"
		productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${property("deps.fabric_api")}"
	}

	if (isNeoForge) {
		neoForge "net.neoforged:neoforge:${property('loader.neoforge')}"

		modImplementation("dev.isxander:yet-another-config-lib:${property('deps.yacl')}-${loader}") {
			transitive = false
		}

		compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.2.0"))
		implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-${loader}:0.2.0"))

		// forge does not include mixinextras, and neoforge has a version that's too old <= 1.20.6
		if (isNeoForge && stonecutter.eval(mcVersion, "<=1.20.6")) {
			compileOnly(implementation("io.github.llamalad7:mixinextras-common:${property("deps.mixin_extras")}"))
			include(implementation("io.github.llamalad7:mixinextras-${loader}:${property("deps.mixin_extras")}"))
		}

		if (stonecutter.eval(mcVersion, ">=1.21")) {
			modCompileOnly "maven.modrinth:iris:${property('deps.iris')}"
			modCompileOnly "maven.modrinth:sodium-extra:${property('deps.sodium_extra')}"
			modCompileOnly "maven.modrinth:sodium-options-api:neoforge-1.21.1-1.0.9"
		} else {
			modCompileOnly "maven.modrinth:oculus:1.20.1-1.7.0"
			if (stonecutter.eval(mcVersion, "=1.20.1")) // coderbot package
				modCompileOnly project.rootProject.files("vendor/oculus-mc1.20.1-1.6.15a-ripped.jar")
			modCompileOnly "maven.modrinth:rubidium-extra:0.5.7e+mc1.21-build.129"
		}

		if (!property("deps.terra_firma_craft").blank)
			modCompileOnly "maven.modrinth:terrafirmacraft:${property('deps.terra_firma_craft')}"

		// Because yarn mappings are used the mods can't be loaded from the 'mods' directory at runtime.
		// It causes NoClassDefFoundErrors due to the different mappings.
		// This is a workaround that uses 'modLocalRuntime' to remap the mods found in the 'mods-forge' directory.
		// It requires a project reload when the mods change.
		if (stonecutter.current.active) {
			def localModsDir = project.rootProject.file('./run/mods-forge/')
			if (localModsDir.exists() && localModsDir.isDirectory()) {
				def localMods = localModsDir
						.listFiles({ file -> file.isFile() && file.name.endsWith('.jar') } as FileFilter)
				localMods.each { mod ->
					println "Added Forge Mod: " + mod.name
					dependencies {
						modLocalRuntime files(mod)
					}
				}
			}
		}
	}

	include(implementation('gs.mclo:api:5.0.0'))
	compileOnly "maven.modrinth:distanthorizonsapi:6.1.0"
	modCompileOnly "maven.modrinth:serene-seasons:${property('deps.serene_seasons')}"
	modCompileOnly "maven.modrinth:enhanced-celestials:${property('deps.enhanced_celestials')}"
	modCompileOnly "maven.modrinth:data-anchor:D3z4pTH6" // use fabric 1.21.1 version for all
	if (!property("deps.sodium").blank)
		modCompileOnly "maven.modrinth:sodium:${property('deps.sodium')}"
}

processResources {
	var props = [
			version: project.version,
			loader : loader,
	]
	if (isFabric) {
		props["mc_version_range"] = findProperty("deps.minecraft").toString().split(",").collect {
			"\"=$it\""
		}.join(", ")
	} else {
		props["mc_version_range"] = findProperty("deps.minecraft").toString().split(",").collect {
			"[$it]"
		}.join(",")
	}
	if (isNeoForge) {
		props["neoforge_version_range"] = findProperty("deps.neoforge").toString()
	}

	props.forEach(inputs::property)

	filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml"]) {
		expand props
	}

	if (isNeoForge)
		exclude("fabric.mod.json")
	if (isFabric)
		exclude("META-INF/mods.toml", "META-INF/neoforge.mods.toml")

	exclude("assets/**/*.ase")
	exclude("assets/**/*.xcf")
}

remapJar {
	if (isNeoForge) {
		atAccessWideners.add("betterclouds.accesswidener")
	}
}

def j21 = stonecutter.eval(mcVersion, ">=1.20.6")
tasks.withType(JavaCompile).configureEach {
	it.options.release = j21 ? 21 : 17
}

java {
	// withSourcesJar()
	sourceCompatibility = j21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
	targetCompatibility = j21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
}

// Testing
if (isFabric) {
	def configureProdClientRunTask = { it ->
		// depend on all possible 'downloadAssets' tasks
		// this is dumb but I couldn't figure out anything better
		stonecutter.versions.each { vers ->
			it.mustRunAfter(":${vers.project}:downloadAssets")
		}
		// This runs the game as a normal client would, in a production env
		it.runDir = rootProject.file("runTest")
	}
	project.tasks.register("runProdClient", ClientProductionRunTask) {
		configureProdClientRunTask(it)
		it.outputs.upToDateWhen { false }
	}
	project.tasks.register("runClientTest", ClientProductionRunTask) {
		configureProdClientRunTask(it)
		jvmArgs.add("-Dbetterclouds.client.gametest")
		// I'm not sure about this:
		// it.outputs.upToDateWhen { false }
	}
} else {
	loom {
		runs {
			// Not actually prod
			clientTest {
				client()
				ideConfigGenerated = false
				runDir = "../../runTest"
				vmArgs "-Dbetterclouds.client.gametest"
			}
		}
	}
	afterEvaluate {
		project.tasks.named("runClientTest").configure {
			stonecutter.versions.each { vers ->
				it.mustRunAfter(":${vers.project}:downloadAssets")
			}
		}
	}
}

afterEvaluate {
	// Run in order from oldest to newest
	project.tasks.named("runClientTest").configure {
		stonecutter.versions.each { vers ->
			if (stonecutter.eval(vers.version, "<${stonecutter.current.version}")) {
				it.mustRunAfter(":${vers.project}:runClientTest")
			}
		}
	}
}

if (stonecutter.current.active) {
	rootProject.tasks.register("activeBuild") {
		group = "project"
		dependsOn(tasks.named("build"))
	}
	rootProject.tasks.register("activeRemapJar") {
		group = "project"
		dependsOn(tasks.named("remapJar"))
	}
	rootProject.tasks.register("activePublishMods") {
		group = "project"
		dependsOn(tasks.named("publishMods"))
	}
	// Register task to run genSources for the active version only
	rootProject.tasks.register("activeGenSources") {
		group = "project"
		dependsOn(tasks.named("genSources"))
	}
	if (isFabric) {
		rootProject.tasks.register("activeRunProdClient") {
			group = "project"
			dependsOn(tasks.named("runProdClient"))
		}
	}
	rootProject.tasks.register("activeRunClientTest") {
		group = "project"
		dependsOn(tasks.named("runClientTest"))
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from(project.rootProject.file("LICENSE").path) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

if (publishTargetConfig != null) {
publishMods {
	def releaseType = property("mod.release").toString()
	var releaseName = releaseType.capitalize()
	def modVersion = property("mod.version").toString()
	def mcVersions = findProperty("deps.minecraft").toString().split(",").collect { it.trim().replace(".0", "") }
	def dependenciesFor = { String service ->
		def dependencies = publishTargetConfig[service]
		return [
				requires    : dependencies.requires,
				optional    : dependencies.optional,
				incompatible: dependencies.incompatible,
		]
	}

	file = remapJar.archiveFile
	changelog = rootProject.providers.fileContents(rootProject.layout.projectDirectory.file("changelog.md")).asText
	version = "${modVersion}+${mcVersion}-${publishTargetConfig.loader}-${releaseType}"
	type = releaseTypeEnum()
	displayName = "${releaseName} ${modVersion} for ${mcVersion} ${publishTargetConfig.loaderName}"
	modLoaders.add(publishTargetConfig.loader)

	modrinth {
		accessToken = providers.provider { loadPublishSecrets().getProperty("MODRINTH") }
		projectId = "5srFLIaK"
		minecraftVersions.addAll(mcVersions)

		def dependencies = dependenciesFor("modrinth")
		dependencies.requires.each { slug -> requires(slug) }
		dependencies.optional.each { slug -> optional(slug) }
		dependencies.incompatible.each { slug -> incompatible(slug) }

		projectDescription = rootProject.providers.fileContents(rootProject.layout.projectDirectory.file("README.md")).asText
	}

	curseforge {
		accessToken = providers.provider { loadPublishSecrets().getProperty("CURSEFORGE") }
		projectId = "1285973"
		projectSlug = "better-clouds"
		minecraftVersions.addAll(mcVersions)

		changelogType = "markdown"

		javaVersions.add(j21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17)
		clientRequired = true
		serverRequired = false

		def dependencies = dependenciesFor("curseforge")
		dependencies.requires.each { slug -> requires(slug) }
		dependencies.optional.each { slug -> optional(slug) }
		dependencies.incompatible.each { slug -> incompatible(slug) }
	}
}
}

["publishMods", "publishModrinth", "publishCurseforge"].each { taskName ->
	tasks.named(taskName).configure {
		onlyIf { publishTargetConfig != null && isPublishTargetEnabled(loader) }
		doFirst {
			validatePublishChangelog()
		}
	}
}

tasks.register("validatePublishChangelog") {
	group = "publishing"
	description = "Validates that changelog.md exists, is non-blank, and was updated within the last hour."
	doLast {
		validatePublishChangelog()
	}
}

def requestedPublishTaskNames = gradle.startParameter.taskNames.findAll { requestedTaskName ->
	requestedTaskName.tokenize(":").last() in ["activePublishMods", "publishMods", "publishModrinth", "publishCurseforge"]
}

def requestedPublishModsTaskNames = requestedPublishTaskNames.findAll { requestedTaskName ->
	requestedTaskName.tokenize(":").last() in ["activePublishMods", "publishMods"]
}

if (stonecutter.current.active && !requestedPublishTaskNames.isEmpty()) {
	if (publishTargetConfig == null) {
		throw new GradleException("invalid publishing config")
	}

	if (!isPublishTargetEnabled(loader)) {
		throw new GradleException("publish target '${loader}' is disabled. Set publish.${loader}=true to publish it.")
	}

	if (!requestedPublishModsTaskNames.isEmpty() && !isPublishConfirmationSkipped()) {
		requirePublishConfirmation([
				"Requested publish task(s): ${requestedPublishModsTaskNames.join(", ")}",
				buildVersionString(property("mod.version").toString(), property("mod.release").toString().toLowerCase(Locale.ROOT), mcVersion, loader)
		])
	}
}
